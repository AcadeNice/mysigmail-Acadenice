version: "3.8"

services:
  mysigmail:
    build: .
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=network_name"
      - "traefik.http.routers.mysigmail.rule=Host(`sign.example.tld`)"
      - "traefik.http.routers.mysigmail.entrypoints=websecure"
      - "traefik.http.routers.mysigmail.tls=true"
      - "traefik.http.services.mysigmail.loadbalancer.server.port=80"
    networks:
      - network_name

networks:
  network_name:
    external: true


